name: Windows RDP Custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP and Set Password
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        net user runneradmin Admin@123

    - name: Download Ngrok
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .

    - name: Connect Ngrok Account
      run: .\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Start TCP Tunnel for RDP
      run: |
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow
        Start-Sleep -Seconds 8
        
        # Fetch and display the Ngrok public URL safely
        try {
            $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
            $tunnelUrl = $response.tunnels[0].public_url
            Write-Host "========================================"
            Write-Host "RDP is Ready!"
            Write-Host "Address: $tunnelUrl"
            Write-Host "Username: runneradmin"
            Write-Host "Password: Admin@123"
            Write-Host "========================================"
        } catch {
            Write-Host "Ngrok API took longer to respond, check manual URL or re-run."
        }

    - name: Keep Alive Loop
      run: |
        while ($true) {
            Write-Host "RDP is running... Keeping session alive."
            Start-Sleep -Seconds 60
        }
        
