name: Windows 11 RDP Cloudflare

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP and Set Password
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        net user runneradmin Admin@123

    - name: Download Cloudflare Tunnel (Cloudflared)
      run: |
        Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe

    - name: Start Cloudflare TCP Tunnel and Show URL
      run: |
        # Run cloudflared and output to a log file to capture the URL
        Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url rdp://localhost:3389" -RedirectStandardError "cloudflare.log" -PassThru
        Start-Sleep -Seconds 7
        
        # Read the log to find the trycloudflare URL
        $logContent = Get-Content "cloudflare.log" -Raw
        Write-Host "========================================"
        Write-Host "Windows 11 RDP via Cloudflare is Ready!"
        Write-Host $logContent
        Write-Host "Username: runneradmin"
        Write-Host "Password: Admin@123"
        Write-Host "========================================"

    - name: Keep Alive Loop
      run: |
        while ($true) {
            Write-Host "Windows 11 RDP is running... Keeping session alive."
            Start-Sleep -Seconds 60
        }
        
