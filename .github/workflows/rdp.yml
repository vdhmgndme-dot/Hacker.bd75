name: Windows 11 RDP Pinggy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP and Set Password
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        net user runneradmin Admin@123

    - name: Start Pinggy TCP Tunnel
      run: |
        Start-Process PowerShell -ArgumentList "-NoExit", "-Command", "ssh -p 443 -R0:localhost:3389 a.pinggy.io"
        
        Write-Host "========================================"
        Write-Host "Windows 11 RDP via Pinggy is Ready!"
        Write-Host "Check the GitHub Action log for the Pinggy TCP address (e.g., xxx.pinggy.link:xxxxx)"
        Write-Host "Username: runneradmin"
        Write-Host "Password: Admin@123"
        Write-Host "========================================"

    - name: Keep Alive Loop
      run: |
        while ($true) {
            Write-Host "Windows 11 RDP is running... Keeping session alive."
            Start-Sleep -Seconds 60
        }
        
