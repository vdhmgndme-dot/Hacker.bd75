name: Windows RDP Custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Set Default User Password & Enable RDP
      run: |
        # Change default runneradmin password to 'admin'
        net user runneradmin admin
        
        # Enable RDP and configure firewall
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

    - name: Download Ngrok
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .

    - name: Connect Ngrok Account
      run: .\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Start TCP Tunnel for RDP
      run: Start-Process Powershell -ArgumentList '-Noexit', '-Command', ".\ngrok.exe tcp 3389"

    - name: Display Connection Details
      run: |
        Write-Host "========================================"
        Write-Host "RDP is Ready!"
        Write-Host "Username: runneradmin"
        Write-Host "Password: admin"
        Write-Host "========================================"
        
